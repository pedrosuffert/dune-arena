[DEFAULT]
log_level = INFO
use_case = TON-IOT
force_rewrite = True
grid_search = True
max_usable_cores = 8
chunksize = 1

[TON-IOT]
override_features = True
classes_filter = ["normal", "scanning", "ddos", "dos", "injection", "password", "xss"]
train_data_dir_path = data/stage4
test_data_dir_path = data/stage4
flow_counts_test_file_path = data/stage4/flow_counts_test.csv
flow_counts_train_file_path = data/stage4/flow_counts_all.csv
cluster_data_file_path = data/models/catboost/spp_4cluster.csv
results_dir_path = data/models/catboost/stage4_results
inference_point_list = [4]
features_set = feats_tcc

[FEATURES]
feats_tcc = ["ip.len", "ip.ttl", "tcp.flags.syn", "tcp.flags.ack", "tcp.flags.push", "tcp.flags.fin", "tcp.flags.reset", "ip.proto", "srcport", "dstport", "ip.hdr_len", "tcp.window_size_value", "tcp.hdr_len", "udp.length", "UDP Len Min", "UDP Len Max", "Min Packet Length", "Max Packet Length", "Packet Length Mean", "Packet Length Total", "Flow IAT Min", "Flow IAT Max", "Flow IAT Mean", "SYN Flag Count", "ACK Flag Count", "PSH Flag Count", "FIN Flag Count", "RST Flag Count", "ECE Flag Count"]

